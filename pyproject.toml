[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anthus-cli-login"
version = "0.0.0"
description = "One CLI login for every Anthus product: PKCE sign-in, remote approval, secure storage and renewal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthus AI" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "behave>=1.2.6", "ruff>=0.6"]
linux = ["secretstorage>=3.3; sys_platform == 'linux'"]

[tool.hatch.build.targets.wheel]
packages = ["src/anthus_cli_login"]

[tool.pytest.ini_options]
testpaths = ["src", "infra"]
python_files = ["*_test.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
