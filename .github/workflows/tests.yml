name: tests

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Linux extras and a real Secret Service keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0
          python -m pip install -e ".[dev,linux]"
      - run: python -m ruff check .
      - name: Specs and Gherkin features
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pytest -q -rs
          python -m behave features
      - name: Specs and Gherkin features, with a real Secret Service and kernel keyring
        if: runner.os == 'Linux'
        env:
          # A skipped real backend fails the run instead of passing silently.
          ANTHUS_REQUIRE_REAL: secret-service,kernel-keyring
        run: |
          dbus-run-session -- bash -c '
            set -e
            echo -n "ci-test-password" | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            python -m pytest -q -rs
            python -m behave features
          '

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: The wheel holds no specs and no plaintext test store
        run: |
          python - <<'PY'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if n.endswith("_test.py") or n.endswith("testing_processes.py")]
          assert not bad, f"test files shipped in the wheel: {bad}"
          assert any(n.endswith("anthus_cli_login/__init__.py") for n in names), names
          print("wheel ok:", len(names), "files")
          PY
      - name: The installed wheel imports
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/python -c "import anthus_cli_login; print(anthus_cli_login.__file__)"
